<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>jdBasic - Web IDE</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&display=swap');
  :root{
    --bg:#0a0e0c; --panel:#0c1410; --bd:#16321d; --bd2:#2a5c35;
    --ink:#d6ffe2; --mut:#5fae6f; --green:#00FF41; --blue:#adc7ff;
    --mag:#ff2e97; --cyan:#00e5ff; --amber:#ffb000; --red:#ff4141;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{display:flex;flex-direction:column;background:var(--bg);color:var(--ink);
       font-family:'Fira Code','Cascadia Code',Consolas,monospace;overflow:hidden;}

  .menubar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;
    padding:9px 14px;background:var(--panel);border-bottom:1px solid var(--bd);}
  .brand{font-weight:700;color:var(--green);text-shadow:0 0 8px rgba(0,255,65,.5);
    margin-right:10px;font-size:16px;}
  .brand span{color:var(--mut);font-weight:400;font-size:12px;text-shadow:none;}
  .sep{width:1px;height:22px;background:var(--bd2);margin:0 6px;}
  .spacer{flex:1;}
  .status{color:var(--mut);font-size:12px;}
  button{cursor:pointer;border:none;border-radius:4px;padding:6px 12px;font-size:13px;
    font-weight:600;font-family:inherit;background:transparent;border:1px solid var(--bd2);
    color:var(--green);}
  button:hover{border-color:var(--green);box-shadow:0 0 8px rgba(0,255,65,.2);}
  button.run{background:var(--mag);color:#1a0410;border-color:var(--mag);
    box-shadow:0 0 12px rgba(255,46,151,.45);}
  button.run:hover{box-shadow:0 0 16px rgba(255,46,151,.6);}
  button.cyan{background:var(--cyan);color:#021014;border-color:var(--cyan);
    box-shadow:0 0 12px rgba(0,229,255,.4);}

  .main{flex:1;display:flex;min-height:0;}
  #editor{flex:1;min-width:0;border-right:1px solid var(--bd);}
  .termwrap{flex:1;min-width:0;display:flex;flex-direction:column;background:#050805;}
  .termhdr{padding:5px 12px;font-size:11px;letter-spacing:1px;text-transform:uppercase;
    color:var(--mut);border-bottom:1px solid var(--bd);background:var(--panel);}
  #term{flex:1;min-height:0;padding:6px 4px 4px 8px;}
</style>
</head>
<body>
  <div class="menubar">
    <span class="brand">jdBasic <span>web ide</span></span>
    <button onclick="ide.newFile()">New</button>
    <button onclick="ide.openFile()">Open</button>
    <button onclick="ide.saveFile()">Save</button>
    <span class="sep"></span>
    <button class="run" onclick="ide.run()">&#9654; Run</button>
    <button onclick="ide.reset()">Reset</button>
    <button onclick="ide.clearTerm()">Clear</button>
    <span class="spacer"></span>
    <span class="status" id="status">loading runtime...</span>
  </div>
  <div class="main">
    <div id="editor"></div>
    <div class="termwrap">
      <div class="termhdr">Terminal</div>
      <div id="term"></div>
    </div>
  </div>
  <input type="file" id="fileopen" accept=".jdb,.bas,.txt" hidden>

  <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/loader.js"></script>
  <script src="jdbasic.js"></script>
  <script>
  const ide = (function(){
    let editor = null, term = null, fit = null, Mod = null, ready = false;
    const SAMPLE =
      'PRINT "Hello from jdBasic in the browser!"\n' +
      'PRINT "------------------------------------"\n' +
      'FOR i = 1 TO 5\n' +
      '    PRINT i, " squared is ", i * i\n' +
      'NEXT i\n' +
      '\n' +
      'DIM xs = [10, 20, 30, 40]\n' +
      'PRINT "sum  = "; SUM(xs)\n' +
      'PRINT "mean = "; SUM(xs) / LEN(xs)\n';

    function setStatus(t, color){ const s=document.getElementById('status');
      s.textContent=t; s.style.color=color||'var(--mut)'; }

    // ---- terminal ----
    term = new Terminal({
      fontFamily:"'Fira Code', monospace", fontSize:14, cursorBlink:true,
      theme:{ background:'#050805', foreground:'#d6ffe2', cursor:'#00FF41',
              green:'#00FF41', brightGreen:'#39ff14', cyan:'#00e5ff',
              magenta:'#ff2e97', red:'#ff4141', yellow:'#ffb000', blue:'#adc7ff' }
    });
    fit = new FitAddon.FitAddon(); term.loadAddon(fit);
    term.open(document.getElementById('term')); fit.fit();
    window.addEventListener('resize', ()=>{ try{ fit.fit(); }catch(e){} });
    function wr(line){ term.write(String(line).replace(/\n/g,'\r\n') + '\r\n'); }

    // ---- monaco ----
    require.config({ paths:{ vs:'https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs' }});
    require(['vs/editor/editor.main'], function(){
      monaco.editor.defineTheme('phosphor', {
        base:'vs-dark', inherit:true,
        rules:[
          { token:'comment', foreground:'5fae6f', fontStyle:'italic' },
          { token:'string', foreground:'00e5ff' },
          { token:'keyword', foreground:'ff2e97' },
          { token:'number', foreground:'ffb000' }
        ],
        colors:{ 'editor.background':'#0a0e0c', 'editor.foreground':'#d6ffe2',
          'editorCursor.foreground':'#00FF41', 'editorLineNumber.foreground':'#2a5c35',
          'editor.selectionBackground':'#16321d', 'editor.lineHighlightBackground':'#0c1410' }
      });
      editor = monaco.editor.create(document.getElementById('editor'), {
        value: SAMPLE, language:'plaintext', theme:'phosphor',
        fontFamily:"'Fira Code', monospace", fontSize:14, minimap:{enabled:false},
        scrollBeyondLastLine:false, automaticLayout:true, tabSize:4
      });
      // Ctrl/Cmd+Enter runs
      editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.Enter, ()=>api.run());
    });

    // ---- wasm runtime ----
    createJdBasic({
      print:    (t)=> term.write(String(t).replace(/\n/g,'\r\n') + '\r\n'),
      printErr: (t)=> term.write('\x1b[31m' + String(t) + '\x1b[0m\r\n')
    }).then(M=>{
      Mod = M; ready = true;
      setStatus('runtime ready', 'var(--green)');
      term.write('\x1b[32m[jdBasic runtime ready - edit code, press Run or Ctrl+Enter]\x1b[0m\r\n');
    }).catch(e=>{ setStatus('runtime failed', 'var(--red)'); wr('runtime load error: '+e); });

    const api = {
      run(){
        if(!ready){ wr('runtime not ready yet'); return; }
        const code = editor ? editor.getValue() : '';
        term.write('\x1b[90m--- run ---\x1b[0m\r\n');
        try { Mod.ccall('jdb_run','void',['string'],[code]); }
        catch(e){ term.write('\x1b[31m'+e+'\x1b[0m\r\n'); }
      },
      reset(){ if(ready){ Mod.ccall('jdb_reset','void',[],[]); } term.clear(); },
      clearTerm(){ term.clear(); },
      newFile(){ if(editor) editor.setValue('PRINT "Hello"\n'); term.clear(); },
      openFile(){ document.getElementById('fileopen').click(); },
      saveFile(){
        const code = editor ? editor.getValue() : '';
        const blob = new Blob([code], {type:'text/plain'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob); a.download = 'program.jdb';
        a.click(); URL.revokeObjectURL(a.href);
      }
    };
    document.getElementById('fileopen').addEventListener('change', function(ev){
      const f = ev.target.files[0]; if(!f) return;
      const r = new FileReader();
      r.onload = ()=>{ if(editor) editor.setValue(r.result); };
      r.readAsText(f); ev.target.value='';
    });
    return api;
  })();
  </script>
</body>
</html>
