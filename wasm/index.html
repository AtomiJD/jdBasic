<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>jdBasic - Web</title>
<!-- Added to the home screen, the page runs without browser chrome, which is
     the only way iOS gives a web game the whole display. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<link rel="stylesheet" href="vendor/xterm/xterm.css">
<link rel="stylesheet" href="vendor/fonts/fira-code.css">
<style>
  :root{
    --bg:#0a0e0c; --panel:#0c1410; --bd:#16321d; --bd2:#2a5c35;
    --ink:#d6ffe2; --mut:#5fae6f; --green:#00FF41; --blue:#adc7ff;
    --mag:#ff2e97; --cyan:#00e5ff; --amber:#ffb000; --red:#ff4141;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{display:flex;flex-direction:column;background:#050805;color:var(--ink);
       font-family:'Fira Code','Cascadia Code',Consolas,monospace;overflow:hidden;}
  .menubar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;
    padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--bd);}
  .brand{font-weight:700;color:var(--green);text-shadow:0 0 8px rgba(0,255,65,.5);
    margin-right:10px;font-size:16px;}
  .brand span{color:var(--mut);font-weight:400;font-size:12px;text-shadow:none;}
  .spacer{flex:1;}
  .status{color:var(--mut);font-size:12px;}
  button{cursor:pointer;border-radius:4px;padding:5px 11px;font-size:13px;
    font-weight:600;font-family:inherit;background:transparent;border:1px solid var(--bd2);
    color:var(--green);}
  button:hover{border-color:var(--green);box-shadow:0 0 8px rgba(0,255,65,.2);}
  button.run{background:var(--mag);color:#1a0410;border-color:var(--mag);
    box-shadow:0 0 12px rgba(255,46,151,.45);}
  button.cyan{background:var(--cyan);color:#021014;border-color:var(--cyan);}
  #term{flex:1;min-height:0;padding:6px 4px 4px 8px;}

  /* EDIT editor overlay (opened by the EDIT command) */
  #editor-overlay{position:fixed;inset:0;display:none;flex-direction:column;
    background:var(--bg);z-index:50;}
  #editor-overlay.open{display:flex;}
  .ebar{display:flex;align-items:center;gap:6px;padding:8px 14px;
    background:var(--panel);border-bottom:1px solid var(--bd);}
  .ebar .t{color:var(--green);font-weight:700;margin-right:8px;}
  .ebar .hint{color:var(--mut);font-size:12px;}
  #editor{flex:1;min-height:0;}

  #gfx-overlay{position:fixed;inset:0;display:none;flex-direction:column;background:#000;z-index:40;}
  #gfx-overlay.open{display:flex;height:100dvh;}
  /* ?fs=1 - chromeless mode for shared game links: no menubar, no gfx header */
  body.fs .menubar{display:none;}
  body.fs #gfx-overlay .ebar{display:none;}
  .gfxwrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;}
  /* Started from the home screen there is no browser chrome keeping the game
     off the notch and the home indicator, so it keeps itself off them. In a
     browser tab the toolbars already do that and the game keeps the pixels. */
  @media (display-mode: standalone){
    body.fs .gfxwrap{padding:env(safe-area-inset-top) env(safe-area-inset-right)
                             env(safe-area-inset-bottom) env(safe-area-inset-left);}
  }
  #canvas{background:#000;max-width:100%;max-height:100%;outline:none;image-rendering:pixelated;touch-action:none;}
  /* A portrait program in a landscape viewport can only pillarbox - it keeps
     a quarter of the screen and loses the rest to black. Say so instead. */
  #turn{position:fixed;inset:0;z-index:45;display:none;flex-direction:column;
        align-items:center;justify-content:center;gap:14px;background:#000;
        color:#9fe8ff;font-size:15px;letter-spacing:.08em;text-align:center;padding:24px;}
  #turn.show{display:flex;}
  #turn .ph{width:54px;height:88px;border:3px solid #38e0ff;border-radius:10px;
            transform:rotate(90deg);transition:transform .8s ease-in-out;}
  #turn.show .ph{transform:rotate(0deg);}
</style>
</head>
<body>
  <div class="menubar">
    <span class="brand">jdBasic <span>web</span></span>
    <button class="run" onclick="ide.runProgram()">&#9654; Run</button>
    <button onclick="ide.openEditor()">Edit</button>
    <button onclick="ide.clearTerm()">Clear</button>
    <span class="spacer"></span>
    <span class="status" id="status">loading runtime...</span>
  </div>
  <div id="term"></div>

  <div id="editor-overlay">
    <div class="ebar">
      <span class="brand">jdBasic</span><span class="t">EDIT</span>
      <button class="run" onclick="ide.runFromEditor()">&#9654; Run (F5)</button>
      <button onclick="ide.openFile()">Open</button>
      <button onclick="ide.saveFile()">Save</button>
      <button class="cyan" onclick="ide.closeEditor()">Close (Esc)</button>
      <span class="spacer"></span>
      <span class="hint">Edit your program, then Run or Close back to the REPL</span>
    </div>
    <div id="editor"></div>
  </div>

  <div id="gfx-overlay">
    <div class="ebar">
      <span class="brand">jdBasic</span><span class="t">GRAPHICS</span>
      <span class="hint">running... use the program's quit key (often Esc) to return to the REPL</span>
    </div>
    <div class="gfxwrap"><canvas id="canvas" tabindex="0"></canvas></div>
    <div id="turn"><div class="ph"></div><div id="turntext">Bitte das Geraet hochkant halten</div></div>
  </div>
  <input type="file" id="fileopen" accept=".jdb,.bas,.txt" hidden>

  <script src="vendor/xterm/xterm.js"></script>
  <script src="vendor/xterm/addon-fit.js"></script>
  <script src="vendor/monaco/vs/loader.js"></script>
  <script src="jdbasic.js"></script>
  <script>
  const ide = (function(){
    let editor=null, term=null, fit=null, Mod=null, ready=false;
    let lineBuf='', editorOpen=false, running=false;
    let inputResolver=null, inputBuf='';   // INPUT line-read mode (Asyncify)
    let keyQueue=[];   // text-mode KEYDOWN / INKEY$ keys, drained by the runtime
    const history=[]; let hpos=0;
    const PROMPT='\x1b[38;2;0;255;65m>\x1b[0m ';
    const SAMPLE =
      'PRINT "Hello from jdBasic!"\n' +
      'FOR i = 1 TO 5\n' +
      '    PRINT i, " squared is ", i * i\n' +
      'NEXT i\n';
    let program = SAMPLE;

    // jdBasic keywords - shared by the Monaco highlighter and the LIST colorizer.
    const KEYWORDS = ['PRINT','FOR','TO','STEP','NEXT','IF','THEN','ELSE','ELSEIF','ENDIF','END',
      'WHILE','WEND','DO','LOOP','UNTIL','FUNC','SUB','ENDFUNC','ENDSUB','RETURN','DIM','LET','AS',
      'GOTO','GOSUB','EXIT','EXITFOR','EXITDO','EXITFUNC','CONTINUEFOR','CONTINUEDO','SELECT','CASE',
      'SWITCH','DEFAULT','IMPORT','EXPORT','MODULE','AND','OR','NOT','XOR','MOD','ANDALSO','ORELSE',
      'TRUE','FALSE','ON','CALL','STOP','RESUME','SLEEP','OPTION','TRY','CATCH','THROW','TYPE',
      'ENDTYPE','EACH','IN','BY','REM','CONST','STATIC'];
    const KW = new Set(KEYWORDS);
    // ANSI colors so LIST output is highlighted like the editor.
    const C = { kw:'\x1b[38;2;255;46;151m', str:'\x1b[38;2;0;229;255m',
                com:'\x1b[38;2;95;174;111m', num:'\x1b[38;2;255;176;0m', rst:'\x1b[0m' };
    function hlLine(line){
      let out=''; const re=/("(?:[^"]*)")|('.*$)|([A-Za-z_][A-Za-z0-9_.$]*)|(\d+\.?\d*)|([\s\S])/g; let m;
      while((m=re.exec(line))!==null){
        if(m[1]) out+=C.str+m[1]+C.rst;
        else if(m[2]){ out+=C.com+m[2]+C.rst; break; }
        else if(m[3]) out+=(KW.has(m[3].toUpperCase())?C.kw+m[3]+C.rst:m[3]);
        else if(m[4]) out+=C.num+m[4]+C.rst;
        else out+=m[0];
      }
      return out;
    }
    function hlProgram(src){ return src.split('\n').map(hlLine).join('\r\n'); }

    // ---- LOAD / SAVE / DIR over the in-browser MEMFS (operate on the editor
    //      program, so they stay consistent with RUN / EDIT / LIST) ----
    function fnameOf(cmd){ const m = cmd.match(/^\w+\s+"?([^"]+?)"?\s*$/); return m ? m[1].trim() : ''; }
    function listFiles(){
      try {
        const fs = Mod.FS.readdir('/').filter(f=>/\.(jdb|bas)$/i.test(f)).sort();
        term.write('\r\n\x1b[2mprograms (LOAD "name" then RUN):\x1b[0m\r\n');
        if (!fs.length) term.write('  (none)\r\n');
        fs.forEach(f=> term.write('  ' + f + '\r\n'));
      } catch(e){ term.write('\r\n'+e); }
      prompt();
    }
    function readMaybe(p){ try{ return Mod.FS.readFile(p,{encoding:'utf8'}); }catch(e){ return null; } }
    function loadProgram(cmd){
      let n = fnameOf(cmd); if(!n){ term.write('\r\nusage: LOAD name'); prompt(); return; }
      let base = n.startsWith('/') ? n : '/'+n;
      let data = readMaybe(base);
      if(data===null && !/\.\w+$/.test(base)){ const d2=readMaybe(base+'.jdb'); if(d2!==null){ data=d2; base+='.jdb'; } }
      if(data===null){ term.write('\r\n\x1b[31mcannot load '+n+'\x1b[0m'); prompt(); return; }
      program = data; if(editor) editor.setValue(program);
      term.write('\r\n\x1b[32mloaded '+base+' ('+program.split('\n').length+' lines). RUN or EDIT.\x1b[0m');
      prompt();
    }
    function newProgram(){ program=''; if(editor) editor.setValue('');
      term.write('\r\n\x1b[32mnew program\x1b[0m'); prompt(); }
    function saveProgram(cmd){
      let n = fnameOf(cmd); if(!n){ term.write('\r\nusage: SAVE "name.jdb"'); prompt(); return; }
      if(!/\.\w+$/.test(n)) n += '.jdb';
      if(!n.startsWith('/')) n='/'+n;
      const src = editor ? editor.getValue() : program; program = src;
      try { Mod.FS.writeFile(n, src); term.write('\r\n\x1b[32msaved '+n+'\x1b[0m'); }
      catch(e){ term.write('\r\n\x1b[31mcannot save '+n+'\x1b[0m'); }
      prompt();
    }

    function setStatus(t,c){ const s=document.getElementById('status');
      s.textContent=t; s.style.color=c||'var(--mut)'; }

    // ---- terminal ----
    term = new Terminal({
      fontFamily:"'Fira Code', monospace", fontSize:14, cursorBlink:true, convertEol:true,
      theme:{ background:'#050805', foreground:'#33ff6a', cursor:'#00FF41',
              green:'#00FF41', cyan:'#00e5ff', magenta:'#ff2e97', red:'#ff4141',
              yellow:'#ffb000', blue:'#adc7ff' }
    });
    fit = new FitAddon.FitAddon(); term.loadAddon(fit);
    term.open(document.getElementById('term')); fit.fit(); term.focus();
    // The web font (Fira Code) loads asynchronously, but xterm measures its
    // fixed cell grid at open() time. If the font is not ready yet, glyphs
    // later render at a slightly different width and columns drift (a grid
    // game's borders "swim"). Re-raster and re-fit once the font has loaded.
    if (document.fonts && document.fonts.load){
      document.fonts.load("14px 'Fira Code'").then(()=>document.fonts.ready).then(()=>{
        try{ if(term.clearTextureAtlas) term.clearTextureAtlas();
             fit.fit(); term.refresh(0, term.rows-1); }catch(e){}
      }).catch(()=>{});
    }
    // Keep the terminal focused so typing works immediately (and after clicks).
    document.getElementById('term').addEventListener('mousedown', ()=>{ if(!editorOpen) term.focus(); });
    window.addEventListener('resize', ()=>{ try{ fit.fit(); }catch(e){} });
    // Monaco loads asynchronously and grabs focus when its editor is created,
    // so a single focus() right after load doesn't stick. Re-assert focus a few
    // times (and once Monaco has settled) so typing works on a fresh page.
    function focusTerm(){ if(!editorOpen && !running){ try{ term.focus(); }catch(e){} } }
    [0,60,300,900].forEach(ms=> setTimeout(focusTerm, ms));
    // Safety net: typing anywhere outside the overlays focuses the terminal.
    document.addEventListener('keydown', (e)=>{
      if(editorOpen||running) return;
      if(e.target && e.target.closest && e.target.closest('#editor-overlay,#gfx-overlay,button,input')) return;
      focusTerm();
    }, true);
    function prompt(){ term.write('\r\n' + PROMPT); }

    // Phone keyboards autocorrect straight quotes into smart quotes and
    // spaces into NBSP - normalize them back so typed code lexes the same
    // as desktop input.
    function normalizeInput(s){
      return s.replace(/[“”„‟«»]/g, '"')
              .replace(/[‘’‚‛]/g, "'")
              .replace(/ /g, ' ');
    }

    async function processLine(line){
      const t = normalizeInput(line).trim();
      if (t === ''){ prompt(); return; }
      if (history[history.length-1] !== t) history.push(t);
      hpos = history.length;
      const up = t.toUpperCase();
      if (up === 'EDIT'){ openEditor(); return; }
      if (up === 'RUN'){ api.runProgram(); return; }
      if (up === 'LIST'){ term.write('\r\n');
        if (Mod && program) Mod.ccall('jdb_list','void',['string'],[program]);
        else term.write('No program loaded.\r\n');
        prompt(); return; }
      if (up === 'CLS' || up === 'CLEAR'){ term.clear(); prompt(); return; }
      if (up === 'NEW'){ newProgram(); return; }
      if (up === 'DIR' || up === 'FILES'){ listFiles(); return; }
      if (up.indexOf('LOAD') === 0){ loadProgram(t); return; }
      if (up.indexOf('SAVE') === 0){ saveProgram(t); return; }
      await runCode(t); prompt();
    }
    // {async:true} returns a promise that resolves when jdb_run FULLY returns -
    // including after the Asyncify suspends of a SLEEP/graphics loop. running
    // gates terminal input while a program (e.g. a game) owns the canvas.
    async function runCode(code){
      code = normalizeInput(code);
      if (!ready){ term.write('\r\nruntime not ready'); return; }
      keyQueue.length = 0;   // drop keys left over from the previous run
      running = true;
      try { await Mod.ccall('jdb_run','void',['string'],[code],{async:true}); }
      catch(e){ term.write('\x1b[31m'+e+'\x1b[0m'); }
      running = false;
    }

    // When the runtime asks for INPUT, the terminal collects one line and the
    // jdbReadLine promise resolves it (Asyncify resumes the program).
    function inputData(d){
      if (d.charCodeAt(0) === 27) return;
      for (const ch of d){
        const c = ch.charCodeAt(0);
        if (ch === '\r'){ term.write('\r\n'); const line=inputBuf; inputBuf='';
          const r=inputResolver; inputResolver=null; r(line); }
        else if (c === 127){ if(inputBuf.length){ inputBuf=inputBuf.slice(0,-1); term.write('\b \b'); } }
        else if (c >= 32){ inputBuf += ch; term.write(ch); }
      }
    }
    // While a program runs, terminal keystrokes feed the program's key queue
    // (text-mode ON "KEYDOWN" / INKEY$ / WAITKEY$). Arrow keys map to the codes
    // the games expect; everything else queues its byte value.
    function pushKeys(d){
      if (d === '\x1b[A'){ keyQueue.push(273); return; } // up
      if (d === '\x1b[B'){ keyQueue.push(274); return; } // down
      if (d === '\x1b[C'){ keyQueue.push(275); return; } // right
      if (d === '\x1b[D'){ keyQueue.push(276); return; } // left
      for (const ch of d) keyQueue.push(ch.charCodeAt(0) & 0xFF);
    }
    // Clipboard. Ctrl+C copies the selection (execCommand fallback, since the
    // async clipboard API is blocked on insecure LAN origins); without a
    // selection it still sends ^C. Ctrl+V returns false so xterm does NOT eat
    // the key - the browser's native paste then fires xterm's own paste handler
    // (the same path the right-click menu uses), which feeds term.onData.
    function execCopy(t){
      const ta=document.createElement('textarea'); ta.value=t;
      ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta);
      ta.focus(); ta.select();
      try{ document.execCommand('copy'); }catch(e){}
      document.body.removeChild(ta); term.focus();
    }
    function copyText(t){
      if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(t).catch(()=>execCopy(t));
      else execCopy(t);
    }
    term.attachCustomKeyEventHandler((e)=>{
      if (e.type !== 'keydown') return true;
      const ctrl = (e.ctrlKey || e.metaKey) && !e.altKey;
      if (!ctrl) return true;
      if (e.code==='KeyC' || e.key==='c' || e.key==='C'){
        if (term.hasSelection && term.hasSelection()){
          copyText(term.getSelection());
          if (term.clearSelection) term.clearSelection();
          return false;
        }
        return true;  // no selection: let ^C through
      }
      if (e.code==='KeyV' || e.key==='v' || e.key==='V') return false;
      return true;
    });
    term.onData(d=>{
      if (editorOpen) return;
      if (inputResolver){ inputData(d); return; }
      if (running){ pushKeys(d); return; }
      if (d === '\x1b[A'){ // up
        if (hpos>0){ hpos--; replaceLine(history[hpos]||''); } return; }
      if (d === '\x1b[B'){ // down
        if (hpos<history.length){ hpos++; replaceLine(history[hpos]||''); } return; }
      if (d.charCodeAt(0) === 27) return; // other escape seqs
      for (const ch of d){
        const c = ch.charCodeAt(0);
        if (ch === '\r'){ term.write('\r\n'); processLine(lineBuf); lineBuf=''; }
        else if (c === 127){ if(lineBuf.length){ lineBuf=lineBuf.slice(0,-1); term.write('\b \b'); } }
        else if (c === 3){ term.write('^C'); lineBuf=''; prompt(); }
        else if (c >= 32){ lineBuf += ch; term.write(ch); }
      }
    });
    function replaceLine(s){
      term.write('\r' + PROMPT + '\x1b[K');  // CR, prompt, clear to EOL
      term.write(s); lineBuf = s;
    }

    // ---- monaco (the EDIT editor) ----
    require.config({ paths:{ vs:'vendor/monaco/vs' }});
    require(['vs/editor/editor.main'], function(){
      monaco.languages.register({ id:'jdbasic' });
      monaco.languages.setMonarchTokensProvider('jdbasic', {
        ignoreCase:true, keywords:KEYWORDS,
        tokenizer:{
          root:[
            [/'.*$/, 'comment'],
            [/"/, { token:'string', next:'@str' }],
            [/\b\d+(\.\d+)?\b/, 'number'],
            [/[A-Za-z_][A-Za-z0-9_.]*\$?/, { cases:{ '@keywords':'keyword', '@default':'identifier' } }],
            [/[-+*/\\^=<>:;,(){}\[\]]/, 'operator']
          ],
          str:[ [/[^"]+/, 'string'], [/"/, { token:'string', next:'@pop' }] ]
        }
      });
      monaco.editor.defineTheme('phosphor', {
        base:'vs-dark', inherit:true,
        rules:[
          {token:'keyword', foreground:'ff2e97', fontStyle:'bold'},
          {token:'string', foreground:'ffb000'},
          {token:'comment', foreground:'5fae6f', fontStyle:'italic'},
          {token:'number', foreground:'ffd700'},
          {token:'operator', foreground:'5fae6f'},
          {token:'identifier', foreground:'00e5ff'}
        ],
        colors:{ 'editor.background':'#0a0e0c', 'editor.foreground':'#33ff6a',
          'editorCursor.foreground':'#00FF41', 'editorLineNumber.foreground':'#2a5c35',
          'editor.lineHighlightBackground':'#0c1410' }
      });
      editor = monaco.editor.create(document.getElementById('editor'), {
        value: program, language:'jdbasic', theme:'phosphor',
        fontFamily:"'Fira Code', monospace", fontSize:14, minimap:{enabled:false},
        scrollBeyondLastLine:false, automaticLayout:true, tabSize:4
      });
      editor.addCommand(monaco.KeyCode.F5, ()=>api.runFromEditor());
      editor.addCommand(monaco.KeyCode.Escape, ()=>api.closeEditor());
      focusTerm();   // Monaco grabs focus on create; hand it back to the REPL
    });

    function openEditor(){
      if (editor) editor.setValue(program);
      document.getElementById('editor-overlay').classList.add('open');
      editorOpen = true;
      if (editor) setTimeout(()=>editor.focus(), 30);
    }

    // jdBasic CHR$ is byte-oriented (CHR$(200) -> byte 0xC8), i.e. extended-ASCII
    // / Latin-1, not UTF-8. Decode the runtime's raw output bytes as Latin-1 so
    // CHR$ tables render as the classic glyphs (byte value = code point).
    function latin1(u8){ let s=''; for(let i=0;i<u8.length;i++) s+=String.fromCharCode(u8[i]); return s; }

    // ---- graphics canvas (revealed when the program calls SCREEN) ----
    // A shared game link should fill the phone, but CSS alone cannot: max-width
    // /max-height never scale a canvas UP past its own pixel size, and a
    // percentage width stops preserving the aspect ratio (the picture stretches).
    // So the fit is computed here, where the SCREEN size is known. The element
    // box stays exactly the scaled picture - the runtime maps pointer events
    // through that box, and any letterbox inside it would offset every tap.
    function fitCanvas(){
      const c = document.getElementById('canvas');
      if (!document.body.classList.contains('fs')) { c.style.width=''; c.style.height=''; return; }
      const box = c.parentElement;
      if (!c.width || !c.height || !box.clientWidth) return;
      const s = Math.min(box.clientWidth / c.width, box.clientHeight / c.height);
      c.style.width  = Math.floor(c.width  * s) + 'px';
      c.style.height = Math.floor(c.height * s) + 'px';
      // a portrait picture that ends up under half the viewport width is a
      // phone held the wrong way round, not a layout to live with. On a
      // desktop it is neither: a window is resized, not turned, so the
      // message would be an instruction nobody there can follow.
      const turn = document.getElementById('turn');
      const handheld = matchMedia('(pointer: coarse)').matches;
      const wrong = handheld && c.height > c.width && (c.width * s) < box.clientWidth * 0.55;
      turn.classList.toggle('show', wrong);
    }
    function showGfx(){ document.getElementById('gfx-overlay').classList.add('open');
      const c=document.getElementById('canvas');
      requestAnimationFrame(fitCanvas);
      setTimeout(()=>{ try{c.focus();}catch(e){} fitCanvas(); },20); }
    function hideGfx(){ document.getElementById('gfx-overlay').classList.remove('open');
      try{ term.focus(); }catch(e){} }
    // The box this fits into keeps moving on a phone: the address bar slides
    // away, the keyboard comes and goes, the device turns. A window resize
    // event covers none of that reliably on iOS - the box simply changes size
    // without one, and the canvas keeps a size measured against a viewport
    // that no longer exists (which leaves a margin on all four sides instead
    // of one). Watching the box itself is the only account that cannot go
    // stale; the events below are the fallback where that is missing.
    // A ResizeObserver runs after layout and before paint, so the fit is
    // corrected in the same frame the box changes and nothing stale is ever
    // shown. The rest is fallback: a size left over from a bigger box does
    // not merely sit wrong, it gets clamped per axis by the max-width and
    // max-height above, and that stretches the picture.
    if (window.ResizeObserver)
      new ResizeObserver(fitCanvas).observe(document.querySelector('.gfxwrap'));
    window.addEventListener('resize', fitCanvas);
    window.addEventListener('orientationchange', ()=> setTimeout(fitCanvas, 200));
    if (window.visualViewport){
      visualViewport.addEventListener('resize', fitCanvas);
      visualViewport.addEventListener('scroll', fitCanvas);
    }
    setInterval(()=>{ if (document.getElementById('gfx-overlay').classList.contains('open')) fitCanvas(); }, 1000);

    // ?fs=1 hides the page chrome so the canvas gets the whole viewport
    if (new URLSearchParams(location.search).get('fs'))
      document.body.classList.add('fs');
    {
      const l = new URLSearchParams(location.search).get('lang') || navigator.language || 'de';
      document.getElementById('turntext').textContent =
        l.slice(0,2) === 'de' ? 'Bitte das Geraet hochkant halten' : 'Please hold the device upright';
    }

    // ---- URL auto-start: ?prog=<name-or-url>[&mode=run|load] ----
    // Lets a shared link open the playground with a program preloaded and
    // (default) already running - no typing needed on a phone.
    let autoDone=false;
    // A shared program may IMPORT modules. They are not in MEMFS unless the
    // build embedded them, so pull each one over HTTP next to the program
    // and drop it at the FS root where IMPORT resolves. Follows the
    // imports of imports, two levels deep.
    async function fetchImports(src, depth){
      if (depth > 2) return;
      const names = [...src.matchAll(/^\s*IMPORT\s+([A-Za-z_]\w*)/gmi)].map(m=>m[1]);
      for (const n of names) {
        const file = n.toLowerCase() + '.jdb';
        if (readMaybe('/'+file) !== null) continue;
        try {
          const r = await fetch(file, {cache:'no-store'});
          if (!r.ok) continue;
          const mod = normalizeInput(await r.text());
          Mod.FS.writeFile('/'+file, mod);
          term.write('\r\n\x1b[2mmodule '+file+'\x1b[0m');
          await fetchImports(mod, depth + 1);
        } catch(e){}
      }
    }
    async function autoStart(){
      const qp = new URLSearchParams(location.search);
      // Expose all query params to the program as /url_params.json in MEMFS
      // (e.g. ?name=... personalizes a shared game link).
      try {
        const params = Object.fromEntries(qp.entries());
        params.__origin = location.origin;   // lets a program talk back to its own host
        params.__lang = (navigator.language || 'de');
        Mod.FS.writeFile('/url_params.json', JSON.stringify(params));
      } catch(e){}
      let prog = qp.get('prog'); if(!prog) return;
      const mode = (qp.get('mode')||'run').toLowerCase();
      let src = null;
      if (/^https?:\/\//i.test(prog)) {
        try { const r = await fetch(prog, {cache:'no-store'}); if (r.ok) src = await r.text(); } catch(e){}
      } else {
        if (!/\.\w+$/.test(prog)) prog += '.jdb';
        src = readMaybe('/'+prog);
        if (src === null) {
          try { const r = await fetch(prog, {cache:'no-store'}); if (r.ok) src = await r.text(); } catch(e){}
        }
      }
      if (src === null) { term.write('\r\n\x1b[31mcannot load '+prog+'\x1b[0m'); prompt(); return; }
      src = normalizeInput(src);
      await fetchImports(src, 0);
      program = src; if(editor) editor.setValue(program);
      term.write('\r\n\x1b[32mloaded '+prog+' ('+src.split('\n').length+' lines)\x1b[0m');
      if (mode === 'run') { term.write('\r\n\x1b[90m--- run ---\x1b[0m\r\n'); await runCode(program); }
      prompt();
    }
    function maybeAutoStart(){ if(ready && Mod && !autoDone){ autoDone=true; autoStart(); } }

    // ---- wasm runtime ----
    createJdBasic({
      canvas: document.getElementById('canvas'),
      jdbTermWrite: (bytes)=> term.write(latin1(bytes)),
      jdbReadLine: ()=> new Promise(res=>{ inputResolver=res; inputBuf=''; if(!editorOpen) term.focus(); }),
      jdbPollKey: ()=> keyQueue.length ? keyQueue.shift() : -1,
      onScreenOpen: (w,h)=>{ showGfx(); },
      onScreenClose: ()=>{ hideGfx(); },
      onJdbReady: ()=>{ ready=true; setStatus('runtime ready','var(--green)');
        term.write('\r\n\x1b[2mDIR . LOAD name . RUN . NEW . EDIT . SAVE name . LIST . CLS\x1b[0m');
        prompt(); focusTerm(); maybeAutoStart(); }
    }).then(M=>{ Mod=M; maybeAutoStart(); }).catch(e=>{ setStatus('runtime failed','var(--red)'); term.write('\r\nload error: '+e); });

    const api = {
      openEditor,
      repl(line){ term.write(line + '\r\n'); processLine(line); },
      closeEditor(){ if(editor) program=editor.getValue();
        document.getElementById('editor-overlay').classList.remove('open');
        editorOpen=false; term.focus(); term.write('\r\n\x1b[2m[editor closed]\x1b[0m'); prompt(); },
      async runFromEditor(){ if(editor) program=editor.getValue();
        document.getElementById('editor-overlay').classList.remove('open'); editorOpen=false;
        term.focus(); term.write('\r\n\x1b[90m--- run ---\x1b[0m\r\n'); await runCode(program); prompt(); },
      async runProgram(){ term.write('\r\n\x1b[90m--- run ---\x1b[0m\r\n'); await runCode(program); prompt(); },
      clearTerm(){ term.clear(); prompt(); },
      openFile(){ document.getElementById('fileopen').click(); },
      saveFile(){ const code = editor?editor.getValue():program;
        const blob = new Blob([code], {type:'text/plain'});
        const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
        a.download='program.jdb'; a.click(); URL.revokeObjectURL(a.href); }
    };
    document.getElementById('fileopen').addEventListener('change', function(ev){
      const f=ev.target.files[0]; if(!f) return;
      const r=new FileReader();
      r.onload=()=>{ program=r.result; if(editor) editor.setValue(program); };
      r.readAsText(f); ev.target.value='';
    });
    return api;
  })();
  </script>
</body>
</html>
