# jdTrakr reverse proxy. Put this at /etc/nginx/sites-available/jdtrakr,
# symlink into sites-enabled, then run certbot to add the TLS block.
#
#   sudo ln -s /etc/nginx/sites-available/jdtrakr /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d trakr.example.com
#
# certbot rewrites this file: it adds the `listen 443 ssl` server block with
# the certificate paths and turns the port-80 block into an HTTPS redirect.

server {
    listen 80;
    listen [::]:80;
    server_name trakr.example.com;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
