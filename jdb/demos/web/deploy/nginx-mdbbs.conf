# jdBBS: a markdown board, served plain over port 80 on purpose. The
# clients are small boards, and a forty column page of public text is
# not worth a handshake they have to pay for. Add a certificate here
# when the name resolves; do not add a redirect, or the boards lose it.
server {
    listen 80;
    listen [::]:80;
    # The bare address answers too, so a board can reach the board
    # before the name exists. Drop it once DNS is in place.
    server_name bbs.jdbasic.tech 72.60.176.59;

    server_tokens off;
    client_max_body_size 16k;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location / {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
