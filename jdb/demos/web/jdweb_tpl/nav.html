<header><h1>{{ app }} <span>{{ sub }}</span></h1><nav>{% for it in nav %}<a class='navlink{% if it.path == active %} active{% endif %}' href='{{ it.path }}'>{{ it.label }}</a>{% endfor %}</nav><div class='spacer'></div><div class='whoami'><span id='whoami'></span><button id='logout' class='ghost'>Logout</button></div></header><script>(async function(){const me=await fetch('/api/me').then(r=>r.ok?r.json():null);if(me&&me.name)document.getElementById('whoami').textContent='Logged in as '+me.name;document.getElementById('logout').addEventListener('click',async()=>{await fetch('/api/logout',{method:'POST'});location='/login';});})();</script>
