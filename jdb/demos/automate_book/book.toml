# The book: what the build reads.

[book]
title = "Automate Your Work for a Better Life Balance"
subtitle = "45 jdBasic programs that give you your hours back"
authors = ["Achim Christ", "Claude"]
version = "0.1 (sample chapter)"
language = "en-US"

[page]
width_mm = 170
height_mm = 240
margin_mm = 20

[images]
width_cm = 12.5

[chapters]
files = [
    "manuscript/00_front.md",
    "manuscript/01_why.md",
    "manuscript/02_toolbox.md",
    "manuscript/02_toolbox_basics.md",
    "manuscript/02_toolbox_libraries.md",
    "manuscript/02_toolbox_running.md",
    "manuscript/03_easy.md",
    "manuscript/03_easy_E01.md",
    "manuscript/03_easy_E02.md",
    "manuscript/03_easy_E03.md",
    "manuscript/03_easy_E04.md",
    "manuscript/03_easy_E05.md",
    "manuscript/03_easy_E06.md",
    "manuscript/03_easy_E07.md",
    "manuscript/03_easy_E08.md",
    "manuscript/03_easy_E09.md",
    "manuscript/03_easy_E10.md",
    "manuscript/03_easy_E11.md",
    "manuscript/03_easy_E12.md",
    "manuscript/03_easy_E13.md",
    "manuscript/03_easy_E14.md",
    "manuscript/03_easy_E15.md",
    "manuscript/04_medium.md",
    "manuscript/04_medium_M01.md",
    "manuscript/04_medium_M02.md",
    "manuscript/04_medium_M03.md",
    "manuscript/04_medium_M04.md",
    "manuscript/04_medium_M05.md",
    "manuscript/04_medium_M06.md",
    "manuscript/04_medium_M07.md",
    "manuscript/04_medium_M08.md",
    "manuscript/04_medium_M09.md",
    "manuscript/04_medium_M10.md",
    "manuscript/04_medium_M11.md",
    "manuscript/04_medium_M12.md",
    "manuscript/04_medium_M13.md",
    "manuscript/04_medium_M14.md",
    "manuscript/04_medium_M15.md",
    "manuscript/04_medium_close.md",
]

[cover]
# Paper thickness per page (white paper at print on demand) and bleed.
paper_mm = 0.0572
bleed_mm = 3.175

[prose]
extra = ["PLAN.md", "README.md", "manuscript/back_cover.md"]

[build]
out = "out"
