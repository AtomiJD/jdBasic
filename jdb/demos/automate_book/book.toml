# The book: what the build reads.

[book]
title = "Office Automation with jdBasic"
subtitle = "50+ Programs Bringing BASIC Back to Business and Your Hours Back to You"
authors = ["Achim Christ", "Claude"]
version = "0.4 (chapters 1 to 4)"
language = "en-US"
publisher = "Achim Christ"
rights = "Text and pictures (c) 2026 Achim Christ, CC BY-NC-ND 4.0. Program code (c) 2026 Computerwelt AI Solutions LLC, MIT License."

