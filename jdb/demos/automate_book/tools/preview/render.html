<!doctype html><html><head><meta charset="utf-8">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<style>body{margin:0;background:#888}canvas{display:block}</style></head><body>
<canvas id="c"></canvas><div id="s"></div>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
const page = Number(location.hash.slice(1) || 1);
const file = new URLSearchParams(location.search).get("file");
pdfjsLib.getDocument(file).promise.then(doc => doc.getPage(page)).then(p => {
  const vp = p.getViewport({scale: 1.8});
  const c = document.getElementById("c"); c.width = vp.width; c.height = vp.height;
  return p.render({canvasContext: c.getContext("2d"), viewport: vp}).promise;
}).then(() => { document.getElementById("s").textContent = "done"; })
  .catch(e => { document.body.innerHTML = "<pre style='font-size:30px'>" + e + "</pre>"; });
</script></body></html>
