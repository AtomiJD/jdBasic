<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>jdVOID - Galactic Clash</title>
<meta name="description" content="Orbitales Duell in jdBasic. Zwei Basen, ein Raum, ein Gegner.">
<meta property="og:type" content="website">
<meta property="og:title" content="jdVOID - Galactic Clash">
<meta property="og:description" content="Orbitales Duell in jdBasic. Namen eintippen, Raum waehlen, losfliegen.">
<meta property="og:image" content="https://vvss.jdbasic.tech/social.png">
<meta property="og:url" content="https://vvss.jdbasic.tech/">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#07070f">
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    background:#07070f;
    color:#e8ecff;
    font-family:'Trebuchet MS','Segoe UI',system-ui,sans-serif;
    display:flex;flex-direction:column;align-items:center;
    min-height:100dvh;padding:0 16px 32px;
  }
  .hero{width:100%;max-width:460px;margin-top:8px;}
  .hero img{width:100%;height:auto;display:block;border-radius:18px;
    box-shadow:0 0 40px rgba(90,200,255,.18);}
  form{width:100%;max-width:460px;margin-top:20px;display:flex;flex-direction:column;gap:12px;}
  label{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#7f8bbd;margin-bottom:-6px;}
  input,select{
    width:100%;padding:14px 16px;font-size:17px;font-family:inherit;
    color:#eaf2ff;background:#12142c;border:1px solid #2c3160;border-radius:12px;
  }
  input:focus,select:focus{outline:none;border-color:#38e0ff;box-shadow:0 0 0 3px rgba(56,224,255,.15);}
  .row{display:flex;gap:12px;}
  .row>div{flex:1;}
  button{
    margin-top:6px;padding:18px;font-size:20px;font-weight:700;letter-spacing:.12em;
    font-family:inherit;color:#04121a;cursor:pointer;
    background:linear-gradient(180deg,#5df0d0,#22c39b);
    border:none;border-radius:14px;box-shadow:0 6px 0 #13795f;
  }
  button:active{transform:translateY(3px);box-shadow:0 3px 0 #13795f;}
  .hint{font-size:13px;color:#6f79a8;text-align:center;margin-top:14px;line-height:1.6;}
  .hint b{color:#9fb0e8;font-weight:600;}
  nav{width:100%;max-width:460px;margin-top:18px;display:flex;gap:10px;}
  nav a{
    flex:1;text-align:center;text-decoration:none;padding:12px 6px;
    font-size:13px;letter-spacing:.06em;color:#9fe8ff;
    background:#12142c;border:1px solid #2c3160;border-radius:12px;
  }
  nav a:active{background:#1a1d3d;}
  #install{width:100%;max-width:460px;margin-top:12px;}
  #install button{
    width:100%;margin:0;padding:14px;font-size:14px;font-weight:600;
    letter-spacing:.08em;color:#9fe8ff;background:#12142c;
    border:1px solid #2c3160;border-radius:12px;box-shadow:none;
  }
  #install button:active{transform:none;background:#1a1d3d;}
  #ios{max-width:460px;}
</style>
</head>
<body>
  <div class="hero"><img src="hero.png" alt="jdVOID - Galactic Clash"></div>

  <form id="f">
    <div>
      <label for="name" id="l_name">Dein Name</label>
      <input id="name" name="name" maxlength="14" autocomplete="nickname" placeholder="Atomi" required>
    </div>
    <div>
      <label for="pin" id="l_pin">PIN</label>
      <input id="pin" name="pin" inputmode="numeric" pattern="[0-9]*" minlength="4" maxlength="8"
             autocomplete="current-password" placeholder="4 Ziffern" required>
    </div>
    <div class="row">
      <div>
        <label for="room" id="l_room">Raum</label>
        <input id="room" name="room" maxlength="16" value="main">
      </div>
      <div>
        <label for="lang" id="l_lang">Sprache</label>
        <select id="lang" name="lang">
          <option value="de">Deutsch</option>
          <option value="en">English</option>
        </select>
      </div>
    </div>
    <button type="submit" id="go">STARTEN</button>
  </form>

  <p class="hint" id="hint">
    Wer denselben <b>Raum</b> waehlt, spielt gegeneinander.<br>
    Dein Name traegt deine Sammlung - nimm immer denselben.
  </p>
  <p class="hint" id="err"></p>

  <nav>
    <a href="players.html" id="l_players">Rangliste</a>
    <a href="cards.html" id="l_cards">Karten</a>
    <a href="balance.html" id="l_balance">Balance</a>
  </nav>

  <div id="install" hidden><button type="button" id="add"></button></div>
  <p class="hint" id="ios"></p>

<script>
  const TXT = {
    de:{name:"Dein Name",pin:"PIN",room:"Raum",lang:"Sprache",go:"STARTEN",pinph:"4 Ziffern",
        players:"Rangliste",cards:"Karten",balance:"Balance",
        hint:"Wer denselben <b>Raum</b> waehlt, spielt gegeneinander.<br>Dein Name plus PIN gehoert ab dem ersten Start dir - sie schuetzt deine Sammlung.",
        add:"AUF DEN STARTBILDSCHIRM",
        ios:"iPhone: unten auf <b>Teilen</b> tippen, dann <b>Zum Home-Bildschirm</b>.<br>Danach startet jdVOID ohne Browserleiste.",
        msg:{msg_badpin:"PIN: 4 bis 8 Ziffern",msg_wrongpin:"Falsche PIN fuer diesen Namen.",
             msg_locked:"Zu viele Versuche. Eine Minute warten.",msg_badname:"Name fehlt oder ist zu lang.",
             msg_badreq:"Anfrage unverstaendlich.",net:"Server nicht erreichbar."}},
    en:{name:"Your name",pin:"PIN",room:"Room",lang:"Language",go:"LAUNCH",pinph:"4 digits",
        players:"Standings",cards:"Cards",balance:"Balance",
        hint:"Whoever picks the same <b>room</b> plays against you.<br>Your name plus PIN is yours from the first launch - it protects your collection.",
        add:"ADD TO HOME SCREEN",
        ios:"iPhone: tap <b>Share</b> below, then <b>Add to Home Screen</b>.<br>jdVOID then starts without the browser bar.",
        msg:{msg_badpin:"PIN: 4 to 8 digits",msg_wrongpin:"Wrong PIN for that name.",
             msg_locked:"Too many tries. Wait a minute.",msg_badname:"Name missing or too long.",
             msg_badreq:"Could not read the request.",net:"Server unreachable."}}
  };
  const $ = id => document.getElementById(id);
  const qp = new URLSearchParams(location.search);

  // Started from the home screen there is no share sheet and no address bar,
  // so neither way in belongs on the page any more.
  const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
                (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  // A link that still carries the old query goes straight into the game.
  if (qp.get('prog')) { location.replace('play/' + location.search); }

  // Remember what was entered last time, so a phone only types it once.
  const saved = JSON.parse(localStorage.getItem('jdvoid') || '{}');
  $('name').value = qp.get('name') || saved.name || '';
  $('room').value = qp.get('room') || saved.room || 'main';
  $('lang').value = qp.get('lang') || saved.lang || (navigator.language || 'de').slice(0,2);
  if (!TXT[$('lang').value]) $('lang').value = 'de';

  function applyLang(){
    const t = TXT[$('lang').value] || TXT.de;
    $('l_name').textContent = t.name;
    $('l_pin').textContent = t.pin;
    $('pin').placeholder = t.pinph;
    $('l_players').textContent = t.players;
    $('l_cards').textContent = t.cards;
    $('l_balance').textContent = t.balance;
    document.querySelectorAll('nav a').forEach(a => {
      a.href = a.getAttribute('href').split('?')[0] + '?lang=' + $('lang').value;
    });
    $('l_room').textContent = t.room;
    $('l_lang').textContent = t.lang;
    $('go').textContent = t.go;
    $('hint').innerHTML = t.hint;
    $('add').textContent = t.add;
    $('ios').innerHTML = (isIOS && !standalone) ? t.ios : '';
    document.documentElement.lang = $('lang').value;
  }
  $('lang').addEventListener('change', applyLang);
  applyLang();

  // The PIN is traded for a session token here, so it never reaches the
  // game URL and never lands in a server log.
  $('f').addEventListener('submit', async ev => {
    ev.preventDefault();
    const name = $('name').value.trim() || 'Spieler';
    const pin  = $('pin').value.trim();
    const room = ($('room').value.trim() || 'main').toLowerCase();
    const lang = $('lang').value;
    const t = TXT[lang] || TXT.de;
    $('err').textContent = '';
    $('go').disabled = true;
    let r;
    try {
      const resp = await fetch('api/login', {
        method: 'POST', headers: {'Content-Type': 'text/plain'},
        body: JSON.stringify({NAME: name, PIN: pin})
      });
      r = await resp.json();
    } catch (e) {
      r = {OK: 0, MSG: 'net'};
    }
    $('go').disabled = false;
    if (!r || r.OK !== 1) {
      $('err').textContent = (t.msg[r && r.MSG] || t.msg.net);
      return;
    }
    localStorage.setItem('jdvoid', JSON.stringify({name, room, lang}));
    const q = new URLSearchParams({prog:'royale', fs:'1', name, room, lang, auth:r.AUTH});
    location.href = 'play/?' + q.toString();
  });

  // Chrome hands its install prompt over instead of showing one itself, and
  // only fires this at all once the manifest and the worker are in place.
  let installer = null;
  window.addEventListener('beforeinstallprompt', ev => {
    ev.preventDefault();
    installer = ev;
    $('install').hidden = false;
  });
  $('add').addEventListener('click', async () => {
    if (!installer) return;
    $('install').hidden = true;
    installer.prompt();
    await installer.userChoice;
    installer = null;
  });
  window.addEventListener('appinstalled', () => { $('install').hidden = true; });

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
