<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <!-- jdBasic class icon - 'jd' monogram drawn as stroked paths so Godot's
       editor-icon SVG rasteriser shows the letters at small sizes (its
       <text> rendering drops glyphs below ~12px). Green-on-black so it
       reads at a glance against GDScript's blue and C#'s green-on-blue. -->
  <rect x="0" y="0" width="16" height="16" rx="2" ry="2" fill="#0a0a0a"/>

  <g fill="none" stroke="#3eff7a" stroke-width="1.4"
     stroke-linecap="round" stroke-linejoin="round">
    <!-- 'j': dot, stem, descender hook -->
    <circle cx="5.6" cy="3.3" r="0.9" fill="#3eff7a" stroke="none"/>
    <path d="M5.6 6 L5.6 11.2 Q5.6 13.0 4.0 12.8"/>

    <!-- 'd': vertical stem on the right, bowl on the left -->
    <path d="M11.6 3.0 L11.6 13.0"/>
    <path d="M11.6 8.0 Q9.5 7.0 8.4 8.6 Q7.6 10.4 8.8 12.0 Q10.2 13.2 11.6 12.4"/>
  </g>
</svg>
