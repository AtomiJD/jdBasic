name: Nightly

# The sweeps that take too long for every push: the gate under
# AddressSanitizer and UndefinedBehaviorSanitizer (tests/sanitize_gate.sh),
# the macOS core build with its gate, the flag families with a headless
# smoke each, and the native compiler on Windows.
on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

jobs:
  sanitizer-gate:
    name: Sanitizer gate (Linux, ASan + UBSan)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Cache Eigen
        id: cache-eigen
        uses: actions/cache@v4
        with:
          path: libs/eigen
          key: eigen-3.4.0-linux

      - name: Fetch Eigen
        if: steps.cache-eigen.outputs.cache-hit != 'true'
        run: |
          curl -sSL https://gitlab.com/libeigen/eigen/-/archive/3.4.0/eigen-3.4.0.tar.gz -o eigen.tar.gz
          mkdir -p libs tmp_eigen
          tar xzf eigen.tar.gz -C tmp_eigen
          mv tmp_eigen/eigen-3.4.0 libs/eigen

      - name: LLVM 18
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-18-dev

      # AddressSanitizer cannot reserve its shadow memory under the address
      # randomisation newer kernels default to.
      - name: Address randomisation ASan can live with
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Build under the sanitizers
        run: SANITIZE=1 HTTP=0 GFX=0 NATIVEC=1 ./build.sh

      - name: Sanitizer gate
        run: bash tests/sanitize_gate.sh 2000

      - name: Sanitizer reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sanitizer-reports
          path: tmp/san
          if-no-files-found: ignore

  macos-core:
    name: Core build + gate (macOS)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Cache Eigen
        id: cache-eigen
        uses: actions/cache@v4
        with:
          path: libs/eigen
          key: eigen-3.4.0-macos

      - name: Fetch Eigen
        if: steps.cache-eigen.outputs.cache-hit != 'true'
        run: |
          curl -sSL https://gitlab.com/libeigen/eigen/-/archive/3.4.0/eigen-3.4.0.tar.gz -o eigen.tar.gz
          mkdir -p libs tmp_eigen
          tar xzf eigen.tar.gz -C tmp_eigen
          mv tmp_eigen/eigen-3.4.0 libs/eigen

      - name: OpenSSL
        run: brew install openssl@3

      - name: Build (core with HTTP, the way the Mac mini builds it)
        run: HTTP=1 GFX=0 ./build.sh

      - name: Gate suites (interpreter)
        run: |
          set +e
          bad=""; n=0
          for f in tests/gate/*_test.jdb tests/gate/test_apl_*.jdb; do
            s=$(basename "$f" .jdb)
            echo "=== $s"
            out=$("./build/jdbasic" "$f" 2>&1); rc=$?
            echo "$out"
            echo "$out" | grep -qE "ALL [A-Z0-9 _-]*TESTS PASSED|, 0 failed"
            marker=$?
            if [ "$rc" -ne 0 ] || [ "$marker" -ne 0 ]; then bad="$bad $s(exit $rc)"; fi
            n=$((n + 1))
          done
          if [ -n "$bad" ]; then echo "gate suites failed:$bad"; exit 1; fi
          echo "$n gate suites green"

  # The flag families the core jobs never compile, one job each so a red
  # names the family: a build with the flag, then a smoke that runs without
  # a display, a sound device or a terminal.
  flag-matrix:
    name: ${{ matrix.family }} build + smoke (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - family: sqlite
            flags: "HTTP=0 GFX=0 SQLITE=1"
            smoke: tests/jdlibs/db_selftest.jdb
          - family: sound
            flags: "HTTP=0 GFX=0 SOUND=1 MINIAUDIO=1 FX=1 MIDI=1"
            smoke: tests/audio/sound_pattern_test.jdb
          - family: gfx
            flags: "HTTP=0 GFX=1 IMGUI=1"
            smoke: tests/gfx/gfx_capture_smoke.jdb
          - family: tui
            flags: "HTTP=0 GFX=0 FTXUI=1 TUI=1"
            smoke: tests/tui/test_tui_smoke.jdb
    env:
      SDL_VIDEODRIVER: offscreen
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v4

      - name: Cache Eigen
        id: cache-eigen
        uses: actions/cache@v4
        with:
          path: libs/eigen
          key: eigen-3.4.0-linux

      - name: Fetch Eigen
        if: steps.cache-eigen.outputs.cache-hit != 'true'
        run: |
          curl -sSL https://gitlab.com/libeigen/eigen/-/archive/3.4.0/eigen-3.4.0.tar.gz -o eigen.tar.gz
          mkdir -p libs tmp_eigen
          tar xzf eigen.tar.gz -C tmp_eigen
          mv tmp_eigen/eigen-3.4.0 libs/eigen

      # The version the Windows build carries; 3.50.4 read a literal with an
      # extreme exponent one ulp off, which the DB selftest sees.
      - name: SQLite amalgamation
        if: matrix.family == 'sqlite'
        run: |
          curl -sSL https://www.sqlite.org/2026/sqlite-amalgamation-3530000.zip -o sqlite.zip
          unzip -q -o sqlite.zip -d tmp_sqlite
          cp tmp_sqlite/sqlite-amalgamation-3530000/sqlite3.c tmp_sqlite/sqlite-amalgamation-3530000/sqlite3.h bridges/sqlitebridge/

      - name: ALSA headers for RtMidi
        if: matrix.family == 'sound'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev

      - name: SDL3 build dependencies
        if: matrix.family == 'gfx'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libharfbuzz-dev libfreetype-dev libpng-dev libjpeg-dev \
            libtiff-dev libwebp-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxfixes-dev libxss-dev libxtst-dev libxinerama-dev libxxf86vm-dev libwayland-dev \
            libxkbcommon-dev libdecor-0-dev libegl1-mesa-dev libgl1-mesa-dev libgles2-mesa-dev \
            libgbm-dev libdrm-dev libdbus-1-dev libudev-dev

      - name: Cache the SDL3 stack
        if: matrix.family == 'gfx'
        id: cache-sdl
        uses: actions/cache@v4
        with:
          path: |
            libs/SDL3
            libs/SDL3_image
            libs/SDL3_ttf
            libs/SDL3_mixer
          key: sdl3-3.4.8-image-3.4.4-ttf-3.2.2-mixer-3.2.2-ubuntu

      - name: Build the SDL3 stack
        if: matrix.family == 'gfx' && steps.cache-sdl.outputs.cache-hit != 'true'
        run: |
          git clone -q --depth 1 --branch release-3.4.8 https://github.com/libsdl-org/SDL.git libs/SDL3
          git clone -q --depth 1 --branch release-3.4.4 https://github.com/libsdl-org/SDL_image.git libs/SDL3_image
          git clone -q --depth 1 --branch release-3.2.2 https://github.com/libsdl-org/SDL_ttf.git libs/SDL3_ttf
          git clone -q --depth 1 --branch release-3.2.2 https://github.com/libsdl-org/SDL_mixer.git libs/SDL3_mixer
          ./build_libs.sh

      - name: Cache FTXUI
        if: matrix.family == 'tui'
        id: cache-ftxui
        uses: actions/cache@v4
        with:
          path: libs/ftxui/build
          key: ftxui-${{ hashFiles('libs/ftxui/CMakeLists.txt', 'libs/ftxui/src/**') }}-ubuntu

      - name: Build FTXUI
        if: matrix.family == 'tui' && steps.cache-ftxui.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build
          cd libs/ftxui && mkdir -p build && cd build
          cmake -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
                -DFTXUI_BUILD_EXAMPLES=OFF -DFTXUI_BUILD_TESTS=OFF -DFTXUI_BUILD_DOCS=OFF ..
          cmake --build . -j

      - name: Build with the family's flags
        run: ${{ matrix.flags }} ./build.sh

      # The smoke has to have run its checks: a suite that skips for want of
      # the feature prints 0 passed, which is no pass.
      - name: Smoke
        run: |
          set +e
          out=$(./build/jdbasic ${{ matrix.smoke }} 2>&1); rc=$?
          echo "$out"
          echo "$out" | grep -qE "ALL [A-Z0-9 _-]*TESTS PASSED|[1-9][0-9]* passed, 0 failed"
          marker=$?
          if [ "$rc" -ne 0 ] || [ "$marker" -ne 0 ]; then echo "smoke failed (exit $rc)"; exit 1; fi

  # The native compiler on the platform users download it for: the Windows
  # build with LLVM-C 18 from the release archive, the runtime DLL, the gate
  # compiled with -c and the differential harness.
  windows-native:
    name: Native compiler build + gate (Windows)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Cache Eigen
        id: cache-eigen
        uses: actions/cache@v4
        with:
          path: libs/eigen
          key: eigen-3.4.0

      - name: Fetch Eigen
        if: steps.cache-eigen.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          Invoke-WebRequest https://gitlab.com/libeigen/eigen/-/archive/3.4.0/eigen-3.4.0.zip -OutFile eigen.zip
          Expand-Archive eigen.zip -DestinationPath tmp_eigen
          New-Item -ItemType Directory -Force libs | Out-Null
          Move-Item tmp_eigen/eigen-3.4.0 libs/eigen

      - name: Cache LLVM-C 18
        id: cache-llvm
        uses: actions/cache@v4
        with:
          path: libs/LLVM
          key: llvm-c-18.1.8-windows-msvc

      # The release archive is a gigabyte; only the C API's headers, import
      # library and DLL are kept, which is what build.bat looks for.
      - name: Fetch LLVM-C 18
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        shell: bash
        run: |
          curl -sSL https://github.com/llvm/llvm-project/releases/download/llvmorg-18.1.8/clang+llvm-18.1.8-x86_64-pc-windows-msvc.tar.xz -o llvm.tar.xz
          mkdir -p tmp_llvm libs/LLVM
          tar xJf llvm.tar.xz -C tmp_llvm --wildcards '*/include/llvm-c/*' '*/include/llvm/Config/*' '*/include/llvm/Support/DataTypes.h' '*/lib/LLVM-C.lib' '*/bin/LLVM-C.dll'
          mv tmp_llvm/*/include tmp_llvm/*/lib tmp_llvm/*/bin libs/LLVM/
          ls libs/LLVM/lib libs/LLVM/bin

      - name: MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build the compiler and the runtime DLL
        shell: cmd
        run: |
          set "MSVC=%VCToolsInstallDir:~0,-1%"
          set "SDK=%WindowsSdkDir:~0,-1%"
          set "SDKV=%WindowsSDKVersion:~0,-1%"
          call build.bat NATIVEC
          if errorlevel 1 exit /b 1
          call build_rt.bat NATIVEC
          if errorlevel 1 exit /b 1

      - name: Gate suites (native -c)
        shell: pwsh
        run: |
          $bad = @()
          foreach ($s in @("comprehensive_test", "native_test.strict", "test_apl_complete", "test_apl_pipelines")) {
            Write-Host "=== $s"
            Remove-Item -ErrorAction SilentlyContinue "tests/gate/$s.exe"
            & build/jdBasic.exe -c "tests/gate/$s.jdb" 2>&1 | Out-String | Write-Host
            if (-not (Test-Path "tests/gate/$s.exe")) { $bad += "$s (compile)"; continue }
            $out = & "tests/gate/$s.exe" 2>&1 | Out-String
            $rc = $LASTEXITCODE
            Write-Host $out
            if ($rc -ne 0 -or $out -notmatch 'ALL [A-Z0-9 _-]*TESTS PASSED|,\s*0 failed') { $bad += "$s (exit $rc)" }
          }
          if ($bad.Count -gt 0) { throw "native gate failed: $($bad -join '; ')" }
          Write-Host "4 gate suites green natively"

      - name: Differential snippets (interpreter vs -c)
        shell: pwsh
        run: |
          & build/jdBasic.exe tools/diff_backends.jdb
          if ($LASTEXITCODE -ne 0) { throw "the backends print differently" }
