<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jdBasic Web REPL</title>
    <style>
        html {
        box-sizing: border-box;
        }
        *, *:before, *:after {
        box-sizing: inherit;
        }
        body {
            font-family: 'Consolas', 'Courier New', monospace;
            background-color: #000000;
            color: #00ff00;
            margin: 0;
            padding: 0.5em;
            font-size: 16px;
            height: 100dvh;
            overflow: hidden;
        }
        #main-container {
            display: flex;
            flex-direction: column;
            height: calc(100dvh - 1em);
            gap: 0.5em;
        }
        #repl-container {
            display: flex; /* Starts visible */
            flex-direction: column;
            flex-grow: 1; 
            border: 2px solid #008f00;
            padding: 1em;
            min-height: 100px;
        }
        #terminal {
            flex-grow: 1;
            overflow-y: scroll;
            white-space: pre-wrap;
        }
        #input-line {
            display: flex;
            border-top: 1px solid #005f00;
            padding: 0.5em;
            padding-top: 0.5em;
        }
        #prompt { padding-right: 0.5em; }
        #input {
            background: transparent; border: none; color: #00ff00;
            font-family: inherit; font-size: inherit; width: 100%;
            outline: none; resize: none; line-height: 1.2em;
        }
        #canvas-container {
            display: none; /* Hidden by default */
            flex-grow: 1;
            border: 2px solid #008f00;
            padding: 1em;
            justify-content: center;
            align-items: center;
            min-height: 100px;            
        }

        #canvas {
            background-color: #111;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
       #editor-overlay {
            display: none; /* Hidden by default */
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        #monaco-container {
            width: 95%;
            height: 95%;
            border: 2px solid #00ff00;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }
        #monaco-editor {
            flex-grow: 1;
        }
        #editor-buttons {
            padding: 0.5em;
            background-color: #111;
            text-align: right;
        }
        #editor-buttons button {
            background-color: #005f00;
            color: #00ff00;
            border: 1px solid #00ff00;
            padding: 0.5em 1em;
            cursor: pointer;
            margin-left: 0.5em;
        }        
    </style>
</head>
<body>
    <div id="main-container">
        <div id="repl-container">
            <div id="terminal"></div>
        </div>
        <div id="canvas-container">
            <canvas id="canvas" width="640" height="480"></canvas>
        </div>
        <div id="input-line">
            <span id="prompt"></span>
            <textarea id="input" rows="1" autofocus placeholder="Type command..."></textarea>
        </div>
    </div>
    <div id="editor-overlay">
        <div id="monaco-container">
            <div id="monaco-editor"></div>
            <div id="editor-buttons">
                <button id="editor-save">Save & Close</button>
                <button id="editor-cancel">Cancel</button>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.49.0/min/vs/loader.js"></script>

    <script>
        const terminalEl = document.getElementById('terminal');
        const inputEl = document.getElementById('input');
        const promptEl = document.getElementById('prompt');
        const canvasEl = document.getElementById('canvas');

        // --- Terminal Simulator with State ---
        const terminal = {
            colors: [
                '#000000', '#0000aa', '#00aa00', '#00aaaa', '#aa0000',
                '#aa00aa', '#aa5500', '#aaaaaa', '#555555', '#5555ff',
                '#55ff55', '#55ffff', '#ff5555', '#ff55ff', '#ffff55', '#ffffff'
            ],
            cursor: { x: 1, y: 1 },
            currentColor: { fg: 7, bg: 0 },

            cls: function() {
                terminalEl.textContent = '';
                this.locate(1, 1);
            },
            locate: function(row, col) {
                this.cursor.y = Math.max(1, row);
                this.cursor.x = Math.max(1, col);
            },
            setColor: function(fg, bg) {
                this.currentColor.fg = fg % 16;
                this.currentColor.bg = bg % 16;
            },
            write: function(text) {
                if (text.endsWith('Ready\n> ')) {
                    const cleanText = text.slice(0, -3);
                    if (cleanText) this.appendSpan(cleanText);
                    terminalEl.innerHTML += '\n';
                    promptEl.textContent = '> ';
                } else {
                    this.appendSpan(text);
                }
                terminalEl.scrollTop = terminalEl.scrollHeight;
            },
            appendSpan: function(text) {
                const span = document.createElement('span');
                span.textContent = text;
                span.style.color = this.colors[this.currentColor.fg];
                span.style.backgroundColor = this.colors[this.currentColor.bg];
                terminalEl.appendChild(span);
            },
            getCursorX: function() { return this.cursor.x; },
            getCursorY: function() { return this.cursor.y; }
        };
        
        // The single entry point for all C++ TextIO calls
        window.terminal_handler = function(command, ...args) {
            switch (command) {
                case 'print':    return terminal.write(args[0]);
                case 'cls':      return terminal.cls();
                case 'locate':   return terminal.locate(args[0], args[1]);
                case 'setColor': return terminal.setColor(args[0], args[1]);
                case 'getCursorX': return terminal.getCursorX();
                case 'getCursorY': return terminal.getCursorY();
            }
        };

        const replContainer = document.getElementById('repl-container');
        const canvasContainer = document.getElementById('canvas-container');

        // This function controls which view is active
        window.set_graphics_mode = function(isGraphicsActive) {
            if (isGraphicsActive) {
                replContainer.style.display = 'none';
                canvasContainer.style.display = 'flex'; // Use flex to center the canvas
            } else {
                canvasContainer.style.display = 'none';
                replContainer.style.display = 'flex';
            }
        };        

        let monacoEditor = null;
        const editorOverlay = document.getElementById('editor-overlay');

        // --- Bridge Functions to interact with Monaco ---
        window.show_monaco_editor = (initialCode) => {
            // Make the overlay visible BEFORE doing anything else.
            // This ensures the container has a size for Monaco to measure.
            editorOverlay.style.display = 'flex';

            if (monacoEditor) {
                // If the editor already exists, just update its content and focus it.
                monacoEditor.setValue(initialCode);
                monacoEditor.focus();
                return;
            }

            // If it's the first time, load Monaco and create the editor.
            require.config({ paths: { 'vs': 'https://cdn.jsdelivr.net/npm/monaco-editor@0.49.0/min/vs' }});
            require(['vs/editor/editor.main'], function() {
                // Register a custom language for jdBasic
                monaco.languages.register({ id: 'jdbasic' });
                monaco.languages.setMonarchTokensProvider('jdbasic', {
                    ignoreCase: true, 

                    keywords: [
                        'PRINT', 'INPUT', 'IF', 'THEN', 'ELSE', 'ENDIF', 'FOR', 'TO', 'STEP', 'CATCH', 'FINALIZE',
                        'NEXT', 'GOTO', 'DIM', 'AS', 'SUB', 'ENDSUB', 'FUNC', 'ENDFUNC', 'TRY', 'ENDTRY',
                        'RETURN', 'RUN', 'LIST', 'LOAD', 'SAVE', 'EDIT', 'NEW', 'END', 'DO', 'LOOP',
                        'WHILE', 'UNTIL', 'EXIT', 'AND', 'OR', 'NOT', 'MOD', 'REACT', 'SWITCH', 'CASE', 'DEFAULT',
                        'REM' 
                    ],
                    tokenizer: {
                        root: [
                            // SOLUTION 2: Update the regex to include the '$' suffix for strings
                            [/[a-zA-Z_][\w\d]*\$?/, { cases: { '@keywords': 'keyword', '@default': 'identifier' } }],
                            
                            [/"/, 'string', '@string'],
                            [/'.*$/, 'comment'],
                            [/\d+/, 'number'],
                        ],
                        string: [
                            [/[^"]+/, 'string'],
                            [/"/, 'string', '@pop']
                        ],
                    }
                });


                monacoEditor = monaco.editor.create(document.getElementById('monaco-editor'), {
                    value: initialCode,
                    language: 'jdbasic',
                    theme: 'vs-dark'
                });

                // Focus the editor so the user can start typing immediately.
                monacoEditor.focus();
            });
        };

        document.getElementById('editor-save').addEventListener('click', () => {
            if (monacoEditor) {
                const newCode = monacoEditor.getValue();
                Module.ccall('update_source_code', null, ['string'], [newCode]);
                editorOverlay.style.display = 'none';
                inputEl.focus();
            }
        });

        document.getElementById('editor-cancel').addEventListener('click', () => {
            editorOverlay.style.display = 'none';
            inputEl.focus();
        });


    var Module = {
        canvas: canvasEl,
        onRuntimeInitialized: function() {
            // Ensure REPL is visible on start
            window.set_graphics_mode(false);
            Module.ccall('init_repl', null, [], []);
        }
    };

    inputEl.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            const command = inputEl.value;
            terminal.write('> ' + command + '\n');
            inputEl.value = '';
            
            // If a program was running, stop it and ensure the REPL is visible
            window.set_graphics_mode(false); 
            
            Module.ccall('run_repl_line', null, ['string'], [command]);
        }
    });    
    </script>
    
    <script async src="index.js"></script>

</body>
</html>
