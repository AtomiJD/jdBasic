<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>jdBasic Web REPL</title>
    <link rel="stylesheet" href="./xterm.css" />
    <style>
        html { box-sizing: border-box; }
        *, *:before, *:after { box-sizing: inherit; }
        body, html {
            font-family: 'Consolas', 'Courier New', monospace;
            background-color: #4d4d4d; color: #0f0;
            margin: 0; padding: 0;
            width: 100%; height: 100dvh;
            overflow: hidden;
        }
        #main-container {
            display: flex;
            flex-direction: column;
            width: 100%; height: 100%;
        }
        .view-container {
            flex-grow: 1;
            overflow: hidden;
            padding: 0.5em;
        }
        #terminal-container { display: flex; }
        #canvas-container { display: none; justify-content: center; align-items: center; }
        #terminal { width: 100%; height: 100%; }
        #canvas { background-color: #111; width: 100%; height: 100%; max-width: 100%; max-height: 100%; object-fit: contain; }
        #editor-overlay {
            display: none; position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.7); z-index: 1000;
            flex-direction: column; align-items: center; justify-content: center;
        }
        #monaco-container { width: 95%; height: 95%; border: 2px solid #0f0; display: flex; flex-direction: column; box-sizing: border-box; }
        #monaco-editor { flex-grow: 1; }
        #editor-buttons { padding: 0.5em; background-color: #111; text-align: right; }
        #editor-buttons button { background-color: #005f00; color: #0f0; border: 1px solid #0f0; padding: 0.5em 1em; cursor: pointer; margin-left: 0.5em; }
    </style>
</head>
<body>
    <div id="main-container">
        <div id="terminal-container" class="view-container">
            <div id="terminal"></div>
        </div>
        <div id="canvas-container" class="view-container">
            <canvas id="canvas"></canvas>
        </div>
    </div>

    <div id="editor-overlay">
        <div id="monaco-container">
            <div id="monaco-editor"></div>
            <div id="editor-buttons">
                <button id="editor-save">Save & Close</button>
                <button id="editor-cancel">Cancel</button>
            </div>
        </div>
    </div>

    <script src="./xterm.js"></script>
    <script src="./xterm-addon-fit.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.49.0/min/vs/loader.js"></script>
    
    <script>
        const terminalContainer = document.getElementById('terminal-container');
        const canvasContainer = document.getElementById('canvas-container');
        const canvasEl = document.getElementById('canvas');

        let vm_state = "";
        window.js_set_vm_state = (rvm_state) => {
            console.log("js_set_vm_state.");
            vm_state = rvm_state;
        };

        // --- Graphics Mode Controller ---
        window.set_graphics_mode = (isGraphicsActive) => {
            terminalContainer.style.display = isGraphicsActive ? 'none' : 'flex';
            canvasContainer.style.display = isGraphicsActive ? 'flex' : 'none';
            if (!isGraphicsActive) {
                term.focus();
            }
        };

        // --- Monaco Editor Logic ---
        let monacoEditor = null;
        const editorOverlay = document.getElementById('editor-overlay');
        window.show_monaco_editor = (initialCode) => {
            editorOverlay.style.display = 'flex';
            if (monacoEditor) {
                monacoEditor.setValue(initialCode);
                monacoEditor.focus();
                return;
            }
            require.config({ paths: { 'vs': 'https://cdn.jsdelivr.net/npm/monaco-editor@0.49.0/min/vs' }});
            require(['vs/editor/editor.main'], function() {
                monaco.languages.register({ id: 'jdbasic' });
                monaco.languages.setMonarchTokensProvider('jdbasic', {
                    ignoreCase: true,
                    keywords: ['PRINT', 'INPUT', 'IF', 'THEN', 'ELSE', 'ENDIF', 'FOR', 'TO', 'STEP', 'NEXT', 'GOTO', 'DIM', 'AS', 'SUB', 'ENDSUB', 'FUNC', 'ENDFUNC', 'RETURN', 'RUN', 'LIST', 'LOAD', 'SAVE', 'EDIT', 'END', 'REM'],
                    tokenizer: {
                        root: [
                            [/[a-zA-Z_][\w\d]*\$?/, { cases: { '@keywords': 'keyword', '@default': 'identifier' } }],
                            [/"/, 'string', '@string'],
                            [/'.*$/, 'comment'],
                            [/\d+/, 'number'],
                        ],
                        string: [ [/[^"]+/, 'string'], [/"/, 'string', '@pop'] ],
                    }
                });
                monacoEditor = monaco.editor.create(document.getElementById('monaco-editor'), {
                    value: initialCode, language: 'jdbasic', theme: 'vs-dark', fontSize: 16
                });
                monacoEditor.focus();
            });
        };
        document.getElementById('editor-save').addEventListener('click', () => {
            if (monacoEditor) {
                Module.ccall('update_source_code', null, ['string'], [monacoEditor.getValue()]);
                editorOverlay.style.display = 'none';
                term.focus();
            }
        });
        document.getElementById('editor-cancel').addEventListener('click', () => {
            editorOverlay.style.display = 'none';
            term.focus();
        });
    </script>

    <script src="./logic.js"></script>
    <script src="index.js"></script>
</body>
</html>
